name: Latest Allowed Dependencies

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  test-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade dependency resolution
        run: uv lock --upgrade
      - name: Install upgraded dependencies
        run: uv sync --all-extras --dev
      - name: Run test suite
        env:
          PYTHONPATH: .
        run: uv run pytest tests/
