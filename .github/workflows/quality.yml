name: Quality Checks

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run Tests
        env:
          PYTHONPATH: .
        run: uv run pytest --cov=src/mdo_framework --cov=src/services --cov-report=xml tests/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  wheel-smoke:
    name: Installed wheel optimization smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: uv build
      - name: Create clean environment
        run: uv venv --python 3.12 .venv-wheel-smoke
      - name: Install wheel and test runner without lockfile
        run: uv pip install --python .venv-wheel-smoke dist/*.whl pytest
      - name: Run installed-wheel smoke test
        run: .venv-wheel-smoke/bin/python -m pytest tests/smoke/test_installed_wheel.py -q

  compose-smoke:
    name: Docker Compose walkthrough smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and wait for healthy services
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Image has no dev dependencies
        run: |
          if docker compose exec -T graph-service python -c "import pytest"; then
            echo "pytest must not be installed in the runtime image"; exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Replay the documented walkthrough
        run: uv run --no-project --python 3.12 --with httpx python tests/smoke/compose_walkthrough.py
      - name: Service logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
